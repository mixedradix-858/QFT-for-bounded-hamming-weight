[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qft-bounded-hamming-weight"
version = "0.1.0"
description = "Explicit Qiskit circuits for general and bounded-Hamming-weight mixed-radix QFTs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "mixedradix-858", email = "lowdepth@yahoo.com"}]
dependencies = ["qiskit==2.4.2", "numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
mixed-radix-qft = "mixed_radix_qft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
